name: Bug report
description: Report a Rust Shield Browser bug (Windows or Android)
title: "[Bug] "
labels: []
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Windows (other)
        - Linux - Ubuntu
        - Linux - Debian
        - Linux - Fedora
        - Linux - Arch
        - Linux - Other distribution
        - macOS
        - Android
        - Multiple platforms
        - Other
    validations:
      required: true
  - type: input
    id: os_details
    attributes:
      label: OS version / Linux distribution
      description: For Linux, include distribution, release and desktop environment. For macOS or Android, include OS version.
      placeholder: "e.g. Ubuntu 24.04 GNOME, macOS 15, Android 15"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "Beta 2 v0.1.3"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Describe the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error messages or screenshots
      description: Remove passwords, tokens and private data.
