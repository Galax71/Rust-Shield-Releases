name: Feature request
description: Suggest a Rust Shield improvement
title: "[Feature] "
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Windows 10
        - Windows (other)
        - Linux - Ubuntu
        - Linux - Debian
        - Linux - Fedora
        - Linux - Arch
        - Linux - Other distribution
        - macOS
        - Android
        - Multiple platforms
        - Other
  - type: textarea
    id: details
    attributes:
      label: Describe the requested feature
    validations:
      required: true
